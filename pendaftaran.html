<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Diri Siswa XI RPL</title>
    <style>
    body {
      max-width: 400px;
      margin: 30px auto;
      background-color: #aab1b5;
      padding: 24px;
      border-radius: 12px;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.1);
      font-family: Arial, sans-serif;
    }
    h1 {
      text-align: center;
      font-size: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      background-color: rgb(0, 140, 255);
      color: white;
      padding: 8px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
    <h1>Data Diri Siswa XI RPL</h1>
    <form
        action="http://rplcoders.com/proses.php"
        method="post"
        enctype="multipart/form-data">
        <input type="hidden" name="id" id="id" value="101">

        <label for="nama">NAMA SISWA :</label>
        <input type="text" id="nama" name="nama" placeholder="Masukan Nama" required>

        <label for="nisn">NIS/NISN :</label>
        <input type="text" id="nisn" name="nisn" placeholder="NIS/NISN" required>

        <label for="nomer">NO/Absen :</label>
        <input type="number" id="nomer" name="nomer" placeholder="NO" required>

        <label for="nomor_hp">Nomor Hp Siswa :</label>
        <input type="text" id="nomor_hp" name="nomor_hp" placeholder="Nomer Hp" required>

        <label for="foto">Foto Siswa :</label>
        <input type="file" id="foto" name="foto">

        <label for="kelas">Kelas :</label>
        <select name="kelas" id="kelas">
            <option value="xirpl1">XI RPL 1</option>
            <option value="xirpl2">XI RPL 2</option>
        </select>

        <label for="tglahir">Tanggal Lahir :</label>
        <input type="date" name="tglahir" id="tglahir">

        <span>Jenis Kelamin :</span>
        <label style="cursor: pointer;" for="jk1">
            <input checked type="radio" name="jk" id="jk1" value="1"> Laki-Laki
        </label>
        <label style="cursor: pointer;" for="jk2">
            <input type="radio" name="jk" id="jk2" value="2"> Perempuan
        </label>

        <label for="alamat">Alamat Lengkap</label>
        <textarea id="alamat" name="alamat" placeholder="Masukkan Alamat Lengkap" required rows="4" cols="50"></textarea>

        <label>
            <input type="checkbox" id="setuju" name="setuju" required> Anda yakin telah mengisi dengan benar
        </label>

        <button type="submit">Kirim</button>
    </form>
</body>
</html>
